# VPORTA.DIR is located at memory address 0x0. So far rust is not able to access
# memory address 0x0. It treats it as invalid pointer and immediately panics
# without even trying to access the address.
VPORTA:
  _delete: DIR

EVSYS:
  "CHANNEL*":
    _modify:
      "CHANNEL*":
        name: CHANNEL
        description: "Channel generator select"
  _array:
    "CHANNEL*": {}

PORT[A-Z]:
  # make PINxCTRL a rust slice
  _array:
    "PIN?CTRL": {}

# Unclear why this is needed, but otherwise things don't get generated properly.
BOD:
  CTRLB:
    _modify:
      LVL:
        description: "BOD Level"
        bitRange: "[2:0]"
        access: read-write
  CTRLA:
    _modify:
      SAMPFREQ:
        description: "Sample frequency"
        bitRange: "[4]"
        access: read-write
      ACTIVE:
        description: "Active"
        bitRange: "[3:2]"
        access: read-write
